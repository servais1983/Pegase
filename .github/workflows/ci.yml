name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pegase
          POSTGRES_PASSWORD: pegase
          POSTGRES_DB: pegase
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U pegase"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps (nmap)
        run: sudo apt-get update && sudo apt-get install -y nmap

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check pegase tests

      - name: Migrate
        env:
          PEGASE_DATABASE_SYNC_URL: postgresql+psycopg2://pegase:pegase@localhost:5432/pegase
        run: alembic upgrade head

      - name: Tests
        env:
          PEGASE_SECRET_KEY: ci-secret-key-not-for-production
          PEGASE_DATABASE_URL: postgresql+asyncpg://pegase:pegase@localhost:5432/pegase
          PEGASE_DATABASE_SYNC_URL: postgresql+psycopg2://pegase:pegase@localhost:5432/pegase
          PEGASE_REDIS_URL: redis://localhost:6379/0
          PEGASE_CELERY_BROKER_URL: redis://localhost:6379/1
          PEGASE_CELERY_RESULT_BACKEND: redis://localhost:6379/2
          PEGASE_AUDIT_LOG_PATH: ${{ runner.temp }}/audit.log
          PEGASE_ARTIFACT_DIR: ${{ runner.temp }}/artifacts
        run: pytest -ra --cov=pegase --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pegase:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run --rm pegase:ci pegase --help
          docker run --rm pegase:ci pegase modules
