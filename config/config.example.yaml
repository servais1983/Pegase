# PEGASE configuration example.
#
# All values can also be set as environment variables prefixed by PEGASE_.
# Environment variables ALWAYS override this file.

environment: development
log_level: INFO
debug: false

# CRITICAL: generate with `python -c "import secrets;print(secrets.token_urlsafe(64))"`
secret_key: "CHANGE-ME-IN-PRODUCTION-this-is-not-safe"

# Database
database_url: postgresql+asyncpg://pegase:pegase@localhost:5432/pegase
database_sync_url: postgresql+psycopg2://pegase:pegase@localhost:5432/pegase

# Redis / Celery
redis_url: redis://localhost:6379/0
celery_broker_url: redis://localhost:6379/1
celery_result_backend: redis://localhost:6379/2

# API
api_host: 0.0.0.0
api_port: 8000
cors_origins:
  - "*"

# Storage
audit_log_path: /var/lib/pegase/audit.log
artifact_dir: /var/lib/pegase/artifacts

# Safety - keep True in production: every mission MUST carry an authorization token.
require_authorization_token: true
max_concurrent_modules: 8
