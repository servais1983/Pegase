# Lab target for the full-stack test. It is only attached to the compose
# network (no published host port) and serves a static page plus robots.txt.
# It is not an exploit harness and it does not proxy anywhere else.
server {
    listen 80;
    server_name lab;
    server_tokens off;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow:\n";
    }

    location / {
        default_type text/plain;
        return 200 "pegase-lab\n";
    }
}
