{{- if .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pegase.fullname" . }}
  labels:
    {{- include "pegase.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.api.ingress.className }}
  rules:
    - host: {{ .Values.api.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pegase.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
  {{- if .Values.api.ingress.tls.enabled }}
  tls:
    - hosts: [ {{ .Values.api.ingress.host | quote }} ]
      secretName: {{ .Values.api.ingress.tls.secretName }}
  {{- end }}
{{- end }}
